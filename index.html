<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>妙筆神猜 (Pictomania) - 即時連線版</title>
  
  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- QRCode.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <!-- 引入獨立題庫檔案 -->
  <script src="words.js"></script>

  <!-- Firebase App & Realtime Database SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    .touch-none {
      touch-action: none;
    }
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col antialiased select-none">

  <!-- 頂部狀態列 -->
  <header class="bg-indigo-600 text-white shadow-md px-4 py-3 flex items-center justify-between sticky top-0 z-30">
    <div class="flex items-center space-x-2">
      <i class="fa-solid fa-paintbrush text-amber-300 text-xl"></i>
      <h1 class="font-black text-lg tracking-wide">妙筆神猜 <span class="text-xs bg-indigo-700 text-amber-200 px-1.5 py-0.5 rounded ml-1 font-normal">Live</span></h1>
    </div>
    <div id="room-badge" class="hidden text-xs bg-indigo-700 border border-indigo-500 rounded-full px-3 py-1 flex items-center space-x-1.5">
      <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
      <span>房號: <b id="display-room-code" class="text-amber-300 tracking-wider">----</b></span>
    </div>
  </header>

  <!-- 主內容容器 -->
  <main class="flex-1 max-w-4xl w-full mx-auto p-3 sm:p-4 flex flex-col">

    <!-- 1. 大廳 / 加入房間畫面 -->
    <section id="view-lobby" class="flex-1 flex flex-col justify-center items-center py-6">
      <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-slate-200/80 p-6 space-y-5">
        <div class="text-center space-y-1">
          <div class="inline-flex p-3 bg-indigo-50 text-indigo-600 rounded-full mb-2">
            <i class="fa-solid fa-users-viewfinder text-3xl"></i>
          </div>
          <h2 class="text-2xl font-bold text-slate-800">加入遊戲大廳</h2>
          <p class="text-xs text-slate-500">同時繪圖、搶答互猜！支援多支手機同步互動</p>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">玩家暱稱</label>
          <div class="relative">
            <i class="fa-solid fa-user absolute left-3 top-3 text-slate-400"></i>
            <input type="text" id="input-nickname" maxlength="8" placeholder="輸入你的暱稱 (最多 8 字)" class="w-full pl-9 pr-3 py-2 border rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
          </div>
        </div>

        <div class="flex border-b border-slate-200 text-sm font-semibold">
          <button id="tab-join" class="flex-1 pb-2 border-b-2 border-indigo-600 text-indigo-600 transition" onclick="switchLobbyTab('join')">加入已有房間</button>
          <button id="tab-create" class="flex-1 pb-2 border-b-2 border-transparent text-slate-400 hover:text-slate-600 transition" onclick="switchLobbyTab('create')">創建新房間</button>
        </div>

        <div id="panel-join" class="space-y-4">
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">房間代碼 (4碼)</label>
            <input type="text" id="input-room-code" maxlength="4" placeholder="例如：K9XP" class="w-full uppercase text-center font-mono font-bold tracking-widest py-2 border rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-lg">
          </div>
          <button onclick="handleJoinRoom()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-lg shadow-indigo-200 active:scale-95 transition flex items-center justify-center space-x-2">
            <i class="fa-solid fa-arrow-right-to-bracket"></i>
            <span>進入房間</span>
          </button>
        </div>

        <div id="panel-create" class="space-y-4 hidden">
          <div class="bg-indigo-50 text-indigo-800 text-xs p-3 rounded-xl flex items-start space-x-2">
            <i class="fa-solid fa-circle-info mt-0.5"></i>
            <span>創建後系統將自動生成專屬房號與 QR Code，朋友掃碼即可秒速加入！</span>
          </div>
          <button onclick="handleCreateRoom()" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-lg shadow-emerald-200 active:scale-95 transition flex items-center justify-center space-x-2">
            <i class="fa-solid fa-plus-circle"></i>
            <span>建立房間</span>
          </button>
        </div>

        <div class="text-center pt-2">
          <button onclick="enableDemoMode()" class="text-xs text-indigo-500 underline hover:text-indigo-700">想先單人體驗？啟動單機模擬模式</button>
        </div>
      </div>
    </section>

    <!-- 2. 等待室畫面 -->
    <section id="view-waiting" class="hidden flex-1 flex flex-col justify-center items-center py-4">
      <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-slate-200/80 p-5 space-y-4">
        
        <div class="bg-indigo-50 border border-indigo-100 rounded-xl p-4 text-center space-y-3">
          <div>
            <span class="text-xs text-indigo-500 font-bold uppercase tracking-wider">房間代碼</span>
            <div id="wait-room-code" class="text-3xl font-black font-mono text-indigo-600 tracking-widest mt-0.5">----</div>
          </div>

          <div class="flex flex-col items-center justify-center pt-1">
            <div id="qrcode-container" class="bg-white p-2.5 rounded-xl shadow-sm border border-slate-200 inline-block"></div>
            <span class="text-[11px] text-slate-500 mt-2 flex items-center space-x-1">
              <i class="fa-solid fa-camera"></i>
              <span>請現場朋友用手機相機掃碼加入</span>
            </span>
          </div>

          <button onclick="copyInviteLink()" class="w-full py-1.5 px-3 bg-white border border-indigo-200 text-indigo-700 rounded-lg text-xs font-semibold hover:bg-indigo-100/50 active:scale-95 transition flex items-center justify-center space-x-1.5">
            <i class="fa-solid fa-link"></i>
            <span id="copy-btn-text">複製專屬邀請連結</span>
          </button>
        </div>

        <div>
          <div class="flex justify-between items-center mb-2 px-1">
            <span class="text-xs font-bold text-slate-600">已加入玩家 (<span id="player-count">1</span>/6)</span>
            <span class="text-[10px] bg-slate-100 text-slate-500 px-2 py-0.5 rounded-full">需至少 2 位玩家</span>
          </div>
          <div id="lobby-player-list" class="space-y-2 max-h-48 overflow-y-auto pr-1"></div>
        </div>

        <div id="host-controls" class="pt-2">
          <button id="btn-start-game" onclick="handleStartGame()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-lg shadow-indigo-200 active:scale-95 transition flex items-center justify-center space-x-2">
            <i class="fa-solid fa-play"></i>
            <span>開始遊戲</span>
          </button>
        </div>
        <div id="guest-waiting-msg" class="hidden text-center text-xs text-slate-400 py-2">
          <i class="fa-solid fa-spinner animate-spin mr-1"></i> 等待房主開始遊戲...
        </div>
      </div>
    </section>

    <!-- 3. 遊戲進行畫面 -->
    <section id="view-game" class="hidden flex-1 flex flex-col space-y-3">
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-3 flex flex-wrap items-center justify-between gap-2">
        <div class="flex items-center space-x-3">
          <div class="bg-amber-100 border border-amber-300 text-amber-900 px-3 py-1.5 rounded-lg text-center">
            <div class="text-[10px] font-bold text-amber-700 uppercase">我的題目</div>
            <div id="my-task-text" class="text-base font-black">---</div>
          </div>
          <div class="text-xs text-slate-500">
            <div>分類：<span id="card-category" class="font-bold text-slate-700">日常用品</span></div>
            <div class="text-[10px] text-slate-400">邊畫邊看別人畫什麼，搶答拿分！</div>
          </div>
        </div>

        <button id="btn-finish-drawing" onclick="handleFinishDrawing()" class="px-4 py-2 bg-emerald-500 hover:bg-emerald-600 text-white rounded-xl font-bold text-xs shadow-md shadow-emerald-100 flex items-center space-x-1.5 active:scale-95 transition">
          <i class="fa-solid fa-flag-checkered"></i>
          <span>我畫完了！(搶速度分)</span>
        </button>
      </div>

      <div class="flex-1 grid grid-cols-1 md:grid-cols-3 gap-3 min-h-[420px]">
        <div class="md:col-span-2 bg-white rounded-xl shadow-sm border border-slate-200 p-3 flex flex-col">
          <div class="flex justify-between items-center mb-2">
            <span class="text-xs font-bold text-slate-700 flex items-center space-x-1.5">
              <i class="fa-solid fa-pen-nib text-indigo-500"></i>
              <span>我的畫布</span>
            </span>
            <div class="flex items-center space-x-2">
              <button onclick="clearMyCanvas()" class="px-2 py-1 text-[11px] bg-slate-100 hover:bg-slate-200 text-slate-600 rounded flex items-center space-x-1 transition">
                <i class="fa-solid fa-rotate-left"></i>
                <span>清空</span>
              </button>
            </div>
          </div>

          <div class="flex-1 w-full relative bg-slate-50 rounded-lg border-2 border-dashed border-slate-200 overflow-hidden flex items-center justify-center">
            <canvas id="myCanvas" class="absolute inset-0 w-full h-full touch-none cursor-crosshair bg-white"></canvas>
          </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-3 flex flex-col">
          <div class="flex justify-between items-center mb-2">
            <span class="text-xs font-bold text-slate-700 flex items-center space-x-1">
              <i class="fa-solid fa-eye text-emerald-500"></i>
              <span>觀看對手並搶猜</span>
            </span>
            <span class="text-[10px] text-slate-400">點擊猜測</span>
          </div>

          <div id="opponents-container" class="flex-1 overflow-y-auto space-y-3 pr-1"></div>
        </div>
      </div>

      <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-3">
        <div class="text-[11px] font-bold text-slate-500 mb-1.5 flex items-center space-x-1">
          <i class="fa-solid fa-list-ol text-indigo-500"></i>
          <span>本輪所有題目卡候選清單：</span>
        </div>
        <div id="theme-word-list" class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-7 gap-1.5 text-xs"></div>
      </div>
    </section>

    <!-- 4. 結算畫面 -->
    <section id="view-result" class="hidden flex-1 flex flex-col justify-center items-center py-6">
      <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-slate-200 p-6 space-y-5 text-center">
        <div class="inline-flex p-4 bg-amber-50 text-amber-500 rounded-full">
          <i class="fa-solid fa-trophy text-4xl"></i>
        </div>
        <div>
          <h2 class="text-2xl font-black text-slate-800">遊戲結算</h2>
          <p class="text-xs text-slate-500">誰才是觀察力與畫工最強的神猜？</p>
        </div>

        <div id="scoreboard-list" class="space-y-2 text-left"></div>

        <button onclick="backToLobby()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-lg shadow-indigo-200 active:scale-95 transition">
          返回大廳再玩一局
        </button>
      </div>
    </section>
  </main>

  <!-- 猜題 Modal 彈窗 -->
  <div id="modal-guess" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl shadow-2xl max-w-sm w-full p-5 space-y-4">
      <div class="text-center">
        <span class="text-xs text-indigo-600 font-bold uppercase">Guess</span>
        <h3 class="text-lg font-bold text-slate-800">你猜 <span id="modal-target-name" class="text-indigo-600">--</span> 畫的是什麼？</h3>
      </div>
      <div id="modal-options-grid" class="grid grid-cols-1 gap-2 max-h-60 overflow-y-auto pr-1 text-xs"></div>
      <button onclick="closeGuessModal()" class="w-full py-2 bg-slate-100 text-slate-600 rounded-xl text-xs font-bold hover:bg-slate-200 transition">
        取消
      </button>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDWiomRZw-XAgzWwHwGY7GhmEzZWnxmP38",
      authDomain: "pictomania-a72e3.firebaseapp.com",
      databaseURL: "https://pictomania-a72e3-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "pictomania-a72e3",
      storageBucket: "pictomania-a72e3.firebasestorage.app",
      messagingSenderId: "657442694569",
      appId: "1:657442694569:web:092a5a04d98e8e006c50b8",
      measurementId: "G-DBDBCM86PF"
    };

    let db = null;
    let isDemoMode = false;

    try {
      if (firebase.apps.length === 0) {
        firebase.initializeApp(firebaseConfig);
      }
      db = firebase.database();
    } catch (e) {
      console.warn("Firebase 初始化異常:", e);
    }

    // 備援題庫 (若 words.js 載入失敗時使用)
    const FALLBACK_WORDS = [
      {
        category: "日常生活用品",
        words: ["電風扇", "吹風機", "吸塵器", "檯燈", "微波爐", "熱水壺", "洗衣機"]
      }
    ];

    let myPlayerId = 'p_' + Math.random().toString(36).substr(2, 6);
    let myNickname = '';
    let currentRoomCode = null;
    let isHost = false;
    let currentTheme = null;
    let myAssignedWord = null;
    let myAssignedWordIndex = -1;
    let guessTargetPlayerId = null;
    let qrCodeInstance = null;

    let localPlayers = {};
    let unsubRoom = null;

    let canvas, ctx;
    let isDrawing = false;
    let strokeBuffer = [];
    let lastSendTime = 0;
    const THROTTLE_MS = 60;

    window.addEventListener('DOMContentLoaded', () => {
      initCanvas();
      checkUrlParams();
    });

    function checkUrlParams() {
      const urlParams = new URLSearchParams(window.location.search);
      const roomParam = urlParams.get('room');
      if (roomParam) {
        switchLobbyTab('join');
        const inputCode = document.getElementById('input-room-code');
        if (inputCode) inputCode.value = roomParam.toUpperCase();
      }
    }

    function switchLobbyTab(tab) {
      const tabJoin = document.getElementById('tab-join');
      const tabCreate = document.getElementById('tab-create');
      const panelJoin = document.getElementById('panel-join');
      const panelCreate = document.getElementById('panel-create');

      if (tab === 'join') {
        tabJoin.className = "flex-1 pb-2 border-b-2 border-indigo-600 text-indigo-600 transition font-semibold";
        tabCreate.className = "flex-1 pb-2 border-b-2 border-transparent text-slate-400 hover:text-slate-600 transition font-semibold";
        panelJoin.classList.remove('hidden');
        panelCreate.classList.add('hidden');
      } else {
        tabCreate.className = "flex-1 pb-2 border-b-2 border-indigo-600 text-indigo-600 transition font-semibold";
        tabJoin.className = "flex-1 pb-2 border-b-2 border-transparent text-slate-400 hover:text-slate-600 transition font-semibold";
        panelCreate.classList.remove('hidden');
        panelJoin.classList.add('hidden');
      }
    }

    function generateQrCode(roomCode) {
      const container = document.getElementById('qrcode-container');
      container.innerHTML = "";
      const cleanUrl = window.location.origin + window.location.pathname;
      const joinUrl = `${cleanUrl}?room=${roomCode}`;

      qrCodeInstance = new QRCode(container, {
        text: joinUrl,
        width: 140,
        height: 140,
        colorDark: "#1e1b4b",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.M
      });
    }

    function copyInviteLink() {
      const cleanUrl = window.location.origin + window.location.pathname;
      const joinUrl = `${cleanUrl}?room=${currentRoomCode}`;
      
      navigator.clipboard.writeText(joinUrl).then(() => {
        const textSpan = document.getElementById('copy-btn-text');
        textSpan.innerText = "已複製連結！";
        setTimeout(() => { textSpan.innerText = "複製專屬邀請連結"; }, 2000);
      }).catch(() => {
        alert("邀請連結：" + joinUrl);
      });
    }

    function getNickname() {
      const val = document.getElementById('input-nickname').value.trim();
      return val || "玩家" + Math.floor(Math.random() * 900 + 100);
    }

    function handleCreateRoom() {
      myNickname = getNickname();
      isHost = true;
      currentRoomCode = Math.random().toString(36).substring(2, 6).toUpperCase();
      
      enterWaitingRoom(currentRoomCode);

      if (db && !isDemoMode) {
        const roomRef = db.ref('rooms/' + currentRoomCode);
        roomRef.set({
          code: currentRoomCode,
          hostId: myPlayerId,
          status: 'waiting',
          createdAt: firebase.database.ServerValue.TIMESTAMP,
          players: {
            [myPlayerId]: {
              id: myPlayerId,
              name: myNickname,
              score: 0,
              isHost: true,
              isFinishedDrawing: false
            }
          }
        }).then(() => {
          listenToRoom(currentRoomCode);
        });
      }
    }

    function handleJoinRoom() {
      myNickname = getNickname();
      const code = document.getElementById('input-room-code').value.trim().toUpperCase();
      if (code.length !== 4) {
        alert("請輸入正確的 4 碼房間編號");
        return;
      }
      isHost = false;
      currentRoomCode = code;

      if (db && !isDemoMode) {
        const roomRef = db.ref('rooms/' + currentRoomCode);
        roomRef.once('value').then(snapshot => {
          if (!snapshot.exists()) {
            alert("找不到此房間，請確認代碼是否正確！");
            return;
          }
          enterWaitingRoom(currentRoomCode);
          roomRef.child('players/' + myPlayerId).set({
            id: myPlayerId,
            name: myNickname,
            score: 0,
            isHost: false,
            isFinishedDrawing: false
          });
          listenToRoom(currentRoomCode);
        });
      } else {
        enterWaitingRoom(currentRoomCode);
      }
    }

    function enterWaitingRoom(code) {
      document.getElementById('view-lobby').classList.add('hidden');
      document.getElementById('view-waiting').classList.remove('hidden');
      document.getElementById('room-badge').classList.remove('hidden');
      document.getElementById('display-room-code').innerText = code;
      document.getElementById('wait-room-code').innerText = code;

      generateQrCode(code);

      if (isHost) {
        document.getElementById('host-controls').classList.remove('hidden');
        document.getElementById('guest-waiting-msg').classList.add('hidden');
      } else {
        document.getElementById('host-controls').classList.add('hidden');
        document.getElementById('guest-waiting-msg').classList.remove('hidden');
      }
    }

    function listenToRoom(code) {
      const roomRef = db.ref('rooms/' + code);
      unsubRoom = roomRef.on('value', snapshot => {
        const data = snapshot.val();
        if (!data) return;

        localPlayers = data.players || {};
        renderLobbyPlayers(localPlayers);

        if (data.status === 'playing' && document.getElementById('view-game').classList.contains('hidden')) {
          setupGameScreen(data);
        }

        if (data.status === 'playing') {
          syncOpponentCanvases(data.strokes || {});
        }

        if (data.status === 'finished' && document.getElementById('view-result').classList.contains('hidden')) {
          showResults(data.players || {});
        }
      });
    }

    function renderLobbyPlayers(players) {
      const listEl = document.getElementById('lobby-player-list');
      listEl.innerHTML = '';
      const playerIds = Object.keys(players);
      document.getElementById('player-count').innerText = playerIds.length;

      playerIds.forEach(id => {
        const p = players[id];
        const item = document.createElement('div');
        item.className = "flex items-center justify-between p-2.5 bg-slate-50 border border-slate-200/60 rounded-xl text-xs";
        item.innerHTML = `
          <div class="flex items-center space-x-2">
            <div class="w-7 h-7 rounded-full bg-indigo-100 text-indigo-700 font-bold flex items-center justify-center">
              ${p.name.charAt(0)}
            </div>
            <span class="font-bold text-slate-700">${p.name} ${id === myPlayerId ? '<span class="text-[10px] text-indigo-500">(我)</span>' : ''}</span>
          </div>
          ${p.isHost ? '<span class="text-[10px] bg-amber-100 text-amber-700 px-2 py-0.5 rounded-full font-bold">房主</span>' : ''}
        `;
        listEl.appendChild(item);
      });
    }

    function handleStartGame() {
      const playerKeys = Object.keys(localPlayers);
      if (playerKeys.length < 2 && !isDemoMode) {
        alert("妙筆神猜需要至少 2 人才能開始喔！");
        return;
      }

      // 從 words.js 載入的題庫挑選，如無則用 fallback
      const pools = (typeof WORD_POOLS !== 'undefined') ? WORD_POOLS : FALLBACK_WORDS;
      const pool = pools[Math.floor(Math.random() * pools.length)];
      
      const shuffledIndices = [0, 1, 2, 3, 4, 5, 6].sort(() => 0.5 - Math.random());
      const playerAssignments = {};

      playerKeys.forEach((pId, idx) => {
        const wordIndex = shuffledIndices[idx % 7];
        playerAssignments[pId] = {
          wordIndex: wordIndex,
          word: pool.words[wordIndex]
        };
      });

      if (db && !isDemoMode) {
        db.ref('rooms/' + currentRoomCode).update({
          status: 'playing',
          currentTheme: pool,
          assignments: playerAssignments,
          strokes: {},
          guesses: {}
        });
      } else {
        setupGameScreen({
          currentTheme: pool,
          assignments: { [myPlayerId]: { wordIndex: 2, word: pool.words[2] } },
          players: localPlayers
        });
      }
    }

    function setupGameScreen(roomData) {
      document.getElementById('view-waiting').classList.add('hidden');
      document.getElementById('view-game').classList.remove('hidden');

      currentTheme = roomData.currentTheme;
      document.getElementById('card-category').innerText = currentTheme.category;

      const listEl = document.getElementById('theme-word-list');
      listEl.innerHTML = '';
      currentTheme.words.forEach((w, i) => {
        const item = document.createElement('div');
        item.className = "bg-slate-50 border border-slate-200 p-2 rounded-lg text-center";
        item.innerHTML = `<span class="font-bold text-indigo-600 block text-[10px]">#${i+1}</span><span class="font-bold text-slate-700">${w}</span>`;
        listEl.appendChild(item);
      });

      const myTask = roomData.assignments[myPlayerId];
      if (myTask) {
        myAssignedWord = myTask.word;
        myAssignedWordIndex = myTask.wordIndex;
        document.getElementById('my-task-text').innerText = `#${myTask.wordIndex + 1} ${myTask.word}`;
      }

      buildOpponentsView(roomData.players || {});
      resizeCanvas();
    }

    function buildOpponentsView(players) {
      const container = document.getElementById('opponents-container');
      container.innerHTML = '';

      Object.keys(players).forEach(pId => {
        if (pId === myPlayerId) return;

        const p = players[pId];
        const card = document.createElement('div');
        card.className = "border border-slate-200 rounded-xl p-2 bg-slate-50 flex flex-col space-y-1.5";
        card.id = `opp-card-${pId}`;
        card.innerHTML = `
          <div class="flex justify-between items-center text-xs">
            <span class="font-bold text-slate-700">${p.name}</span>
            <span id="opp-finish-status-${pId}" class="text-[10px] text-slate-400">繪畫中...</span>
          </div>
          <div class="w-full h-28 bg-white border border-slate-200 rounded-lg overflow-hidden relative">
            <canvas id="opp-canvas-${pId}" class="w-full h-full"></canvas>
          </div>
          <button id="btn-guess-${pId}" onclick="openGuessModal('${pId}', '${p.name}')" class="w-full py-1.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-600 rounded-lg font-bold text-xs border border-indigo-200 transition flex items-center justify-center space-x-1">
            <i class="fa-solid fa-lightbulb"></i>
            <span>猜猜他畫什麼</span>
          </button>
        `;
        container.appendChild(card);
      });
    }

    function initCanvas() {
      canvas = document.getElementById('myCanvas');
      ctx = canvas.getContext('2d');

      const startDraw = (e) => {
        isDrawing = true;
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const x = (clientX - rect.left) / rect.width;
        const y = (clientY - rect.top) / rect.height;

        ctx.beginPath();
        ctx.moveTo(x * canvas.width, y * canvas.height);
        recordPoint(x, y, true);
      };

      const drawing = (e) => {
        if (!isDrawing) return;
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const x = (clientX - rect.left) / rect.width;
        const y = (clientY - rect.top) / rect.height;

        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.strokeStyle = '#1e1b4b';
        ctx.lineTo(x * canvas.width, y * canvas.height);
        ctx.stroke();

        recordPoint(x, y, false);
      };

      const stopDraw = () => {
        if (!isDrawing) return;
        isDrawing = false;
        flushStrokes();
      };

      canvas.addEventListener('mousedown', startDraw);
      canvas.addEventListener('mousemove', drawing);
      window.addEventListener('mouseup', stopDraw);

      canvas.addEventListener('touchstart', startDraw, { passive: false });
      canvas.addEventListener('touchmove', drawing, { passive: false });
      window.addEventListener('touchend', stopDraw);

      window.addEventListener('resize', resizeCanvas);
    }

    function resizeCanvas() {
      if (!canvas) return;
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = rect.width * window.devicePixelRatio;
      canvas.height = rect.height * window.devicePixelRatio;
      ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
    }

    function clearMyCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (db && !isDemoMode) {
        db.ref(`rooms/${currentRoomCode}/strokes/${myPlayerId}`).remove();
      }
    }

    function recordPoint(normX, normY, isNew) {
      strokeBuffer.push({
        x: Math.round(normX * 1000),
        y: Math.round(normY * 1000),
        isNew: isNew
      });

      const now = Date.now();
      if (now - lastSendTime > THROTTLE_MS) {
        flushStrokes();
        lastSendTime = now;
      }
    }

    function flushStrokes() {
      if (strokeBuffer.length === 0) return;
      if (db && !isDemoMode) {
        db.ref(`rooms/${currentRoomCode}/strokes/${myPlayerId}`).push({
          pts: strokeBuffer,
          time: firebase.database.ServerValue.TIMESTAMP
        });
      }
      strokeBuffer = [];
    }

    function syncOpponentCanvases(allStrokes) {
      Object.keys(allStrokes).forEach(pId => {
        if (pId === myPlayerId) return;

        const oppCanvas = document.getElementById(`opp-canvas-${pId}`);
        if (!oppCanvas) return;
        const oCtx = oppCanvas.getContext('2d');

        if (oppCanvas.width !== oppCanvas.clientWidth) {
          oppCanvas.width = oppCanvas.clientWidth;
          oppCanvas.height = oppCanvas.clientHeight;
        }

        oCtx.clearRect(0, 0, oppCanvas.width, oppCanvas.height);
        oCtx.lineWidth = 2;
        oCtx.lineCap = 'round';
        oCtx.strokeStyle = '#334155';

        const strokeBatches = allStrokes[pId];
        Object.keys(strokeBatches).forEach(batchKey => {
          const batch = strokeBatches[batchKey];
          if (!batch.pts) return;

          batch.pts.forEach(pt => {
            const realX = (pt.x / 1000) * oppCanvas.width;
            const realY = (pt.y / 1000) * oppCanvas.height;

            if (pt.isNew) {
              oCtx.beginPath();
              oCtx.moveTo(realX, realY);
            } else {
              oCtx.lineTo(realX, realY);
              oCtx.stroke();
            }
          });
        });
      });
    }

    function handleFinishDrawing() {
      const btn = document.getElementById('btn-finish-drawing');
      btn.disabled = true;
      btn.className = "px-4 py-2 bg-slate-200 text-slate-400 rounded-xl font-bold text-xs cursor-not-allowed flex items-center space-x-1.5";
      btn.innerHTML = `<i class="fa-solid fa-check"></i><span>已完成繪畫！</span>`;

      if (db && !isDemoMode) {
        db.ref(`rooms/${currentRoomCode}/players/${myPlayerId}`).update({
          isFinishedDrawing: true,
          finishTime: firebase.database.ServerValue.TIMESTAMP
        });
      }
    }

    function openGuessModal(targetPId, targetName) {
      guessTargetPlayerId = targetPId;
      document.getElementById('modal-target-name').innerText = targetName;
      
      const grid = document.getElementById('modal-options-grid');
      grid.innerHTML = '';

      currentTheme.words.forEach((w, idx) => {
        const btn = document.createElement('button');
        btn.className = "py-2 px-3 text-left bg-slate-50 hover:bg-indigo-50 border border-slate-200 hover:border-indigo-300 rounded-xl font-bold flex justify-between items-center transition";
        btn.innerHTML = `<span>#${idx+1} ${w}</span><i class="fa-solid fa-chevron-right text-slate-300 text-xs"></i>`;
        btn.onclick = () => submitGuess(targetPId, idx);
        grid.appendChild(btn);
      });

      document.getElementById('modal-guess').classList.remove('hidden');
    }

    function closeGuessModal() {
      document.getElementById('modal-guess').classList.add('hidden');
    }

    function submitGuess(targetPId, guessedWordIndex) {
      closeGuessModal();

      const guessBtn = document.getElementById(`btn-guess-${targetPId}`);
      if (guessBtn) {
        guessBtn.disabled = true;
        guessBtn.className = "w-full py-1.5 bg-slate-100 text-slate-400 rounded-lg font-bold text-xs cursor-not-allowed";
        guessBtn.innerText = `已對其進行猜測`;
      }

      if (db && !isDemoMode) {
        db.ref(`rooms/${currentRoomCode}/guesses/${myPlayerId}_to_${targetPId}`).set({
          from: myPlayerId,
          to: targetPId,
          guessedIndex: guessedWordIndex,
          timestamp: firebase.database.ServerValue.TIMESTAMP
        });

        if (isHost) {
          checkGameCompletion();
        }
      }
    }

    function checkGameCompletion() {
      setTimeout(() => {
        calculateAndFinishGame();
      }, 30000);
    }

    function calculateAndFinishGame() {
      if (!isHost || !db) return;

      db.ref('rooms/' + currentRoomCode).once('value', snap => {
        const room = snap.val();
        const guesses = room.guesses || {};
        const assignments = room.assignments || {};
        const players = room.players || {};

        Object.keys(guesses).forEach(k => {
          const g = guesses[k];
          const targetRealIndex = assignments[g.to].wordIndex;
          if (g.guessedIndex === targetRealIndex) {
            players[g.from].score = (players[g.from].score || 0) + 3;
          } else {
            players[g.from].score = (players[g.from].score || 0) - 1;
          }
        });

        db.ref('rooms/' + currentRoomCode).update({
          status: 'finished',
          players: players
        });
      });
    }

    function showResults(players) {
      document.getElementById('view-game').classList.add('hidden');
      document.getElementById('view-result').classList.remove('hidden');

      const listEl = document.getElementById('scoreboard-list');
      listEl.innerHTML = '';

      const sorted = Object.values(players).sort((a, b) => (b.score || 0) - (a.score || 0));

      sorted.forEach((p, idx) => {
        const item = document.createElement('div');
        item.className = `flex justify-between items-center p-3 rounded-xl border ${idx === 0 ? 'bg-amber-50 border-amber-200' : 'bg-slate-50 border-slate-200'}`;
        item.innerHTML = `
          <div class="flex items-center space-x-2">
            <span class="font-black text-sm ${idx === 0 ? 'text-amber-500' : 'text-slate-400'}">#${idx+1}</span>
            <span class="font-bold text-slate-700">${p.name} ${p.id === myPlayerId ? '(我)' : ''}</span>
          </div>
          <span class="font-black text-base ${idx === 0 ? 'text-amber-600' : 'text-indigo-600'}">${p.score || 0} 分</span>
        `;
        listEl.appendChild(item);
      });
    }

    function backToLobby() {
      location.reload();
    }

    function enableDemoMode() {
      isDemoMode = true;
      myNickname = "我(體驗)";
      currentRoomCode = "DEMO";
      enterWaitingRoom("DEMO");

      localPlayers = {
        [myPlayerId]: { id: myPlayerId, name: myNickname, score: 0, isHost: true },
        'bot_1': { id: 'bot_1', name: '小明(機器人)', score: 0, isHost: false },
        'bot_2': { id: 'bot_2', name: '小華(機器人)', score: 0, isHost: false }
      };
      renderLobbyPlayers(localPlayers);
    }
  </script>
</body>
